<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework 8 - Task 1</title>
    <link rel="stylesheet" href="task-01.css">
</head>
<body>
    <main>
        <h1>Switches</h1>

        <div class="switch-row">
            <label class="switch square">
                <input type="checkbox" aria-label="First square switch">
                <span class="track"></span>
                <span class="knob"></span>
            </label>

            <label class="switch square">
                <input type="checkbox" aria-label="Second square switch" checked>
                <span class="track"></span>
                <span class="knob"></span>
            </label>
        </div>

        <div class="switch-row">
            <label class="switch round">
                <input type="checkbox" aria-label="First round switch">
                <span class="track"></span>
                <span class="knob"></span>
            </label>

            <label class="switch round">
                <input type="checkbox" aria-label="Second round switch" checked>
                <span class="track"></span>
                <span class="knob"></span>
            </label>
        </div>
    </main>
</body>
</html>
