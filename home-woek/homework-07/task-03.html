<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework 7 - Task 3</title>
    <link rel="stylesheet" href="task-03.css">
</head>
<body>
    <main class="contact">
        <h1>GET IN TOUCH</h1>
        <form class="contact-form">
            <div class="contact-fields">
                <label class="visually-hidden" for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Name" autocomplete="name" required>

                <label class="visually-hidden" for="email">Your Mail</label>
                <input id="email" name="email" type="email" placeholder="Your Mail" autocomplete="email" required>
            </div>

            <label class="visually-hidden" for="message">Your message</label>
            <textarea id="message" name="message" placeholder="Type your message" required></textarea>

            <button type="submit">SEND MESSAGE</button>
        </form>
    </main>
</body>
</html>
