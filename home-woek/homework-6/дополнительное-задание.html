<!DOCTYPE html>
<!--
  Семантические теги HTML: роль и возможность повторения на одной странице.

  <html> — корневой элемент документа. Используется один раз.
  <head> — служебная информация о странице. Используется один раз.
  <meta> — метаданные, например кодировка и настройки экрана. Можно несколько раз.
  <title> — название страницы на вкладке браузера. Используется один раз.
  <link> — связь с внешним ресурсом, например файлом CSS. Можно несколько раз.
  <body> — содержимое страницы. Используется один раз.

  <header> — вступительная часть страницы или отдельного раздела. Можно несколько раз.
  <nav> — блок основных навигационных ссылок. Можно несколько раз.
  <main> — основное содержимое документа. Один видимый <main> на странице.
  <section> — тематический раздел с собственным заголовком. Можно несколько раз.
  <article> — самостоятельный материал, например статья или карточка. Можно несколько раз.
  <aside> — дополнительная информация по теме. Можно несколько раз.
  <footer> — завершающая часть страницы или раздела. Можно несколько раз.

  <h1> — заголовок самого высокого уровня. Технически можно несколько раз,
         но для простого документа обычно достаточно одного главного заголовка.
  <h2>–<h6> — заголовки следующих уровней. Можно несколько раз,
              соблюдая логичную иерархию разделов.
  <p> — абзац текста. Можно несколько раз.
  <a> — ссылка на страницу, файл или фрагмент страницы. Можно несколько раз.
  <ul> — неупорядоченный список. Можно несколько раз.
  <ol> — упорядоченный список. Можно несколько раз.
  <li> — пункт списка <ul> или <ol>. Можно несколько раз.
  <figure> — самостоятельная иллюстрация или пример. Можно несколько раз.
  <figcaption> — подпись к <figure>. Не более одной внутри каждого <figure>,
                 но на странице может быть несколько подписей.
  <img> — изображение; смысл передаётся в том числе через атрибут alt.
          Можно несколько раз.
  <time> — дата или время в машиночитаемом виде. Можно несколько раз.
  <address> — контактные данные автора или организации. Можно несколько раз.
  <strong> — важный фрагмент текста. Можно несколько раз.
  <em> — смысловое ударение в тексте. Можно несколько раз.
  <button> — кнопка для действия. Можно несколько раз.

  <div> и <span> — нейтральные контейнеры без собственной семантической роли.
                    Их можно использовать несколько раз, когда подходящего
                    смыслового тега нет.
-->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дополнительное задание — семантические теги</title>
</head>
<body>
  <header>
    <h1>Семантические теги HTML</h1>
    <nav aria-label="Навигация по странице">
      <ul>
        <li><a href="#about">О семантике</a></li>
        <li><a href="#examples">Примеры</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="about" aria-labelledby="about-title">
      <h2 id="about-title">О семантике</h2>
      <p>Семантические теги помогают понять назначение разных частей страницы.</p>
    </section>

    <section id="examples" aria-labelledby="examples-title">
      <h2 id="examples-title">Примеры</h2>
      <article>
        <h3>Статья</h3>
        <p>Тег <strong>article</strong> подходит для самостоятельного материала.</p>
      </article>
    </section>

    <aside>
      <h2>Подсказка</h2>
      <p>Выбирайте тег по смыслу содержимого.</p>
    </aside>
  </main>

  <footer>
    <p>Учебная страница по HTML.</p>
  </footer>
</body>
</html>
